# Local development only. Generated with Supabase CLI 3.0.0, then scoped to EnableWork+.
project_id = "enablework-plus"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 500
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = false
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "5MiB"
[storage.s3_protocol]
enabled = false
[storage.vector]
enabled = false
[storage.analytics]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000/"
additional_redirect_urls = ["http://127.0.0.1:3000/", "http://localhost:3000/", "com.enableworkplus.app://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
[auth.rate_limit]
email_sent = 10
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "5s"
otp_length = 6
otp_expiry = 3600
[auth.sms]
enabled = false
[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2
[functions.resume-finalize]
enabled = true
verify_jwt = true
entrypoint = "./functions/resume-finalize/index.ts"
[functions.resume-scan]
enabled = true
verify_jwt = true
entrypoint = "./functions/resume-scan/index.ts"
[analytics]
enabled = false
